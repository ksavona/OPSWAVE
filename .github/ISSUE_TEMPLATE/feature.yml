name: Feature proposal
description: Propose a scoped capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for related work.
          required: true
        - label: I have described the problem independently of a preferred solution.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who experiences the problem, what happens, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable, measurable success without assuming an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe an approach, important tradeoffs, and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what should and should not be included.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, and operational considerations
      description: Note data, permissions, AI behavior, dependencies, migration, cost, and failure modes that may be affected.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective checks that would make the proposal complete.
    validations:
      required: true
