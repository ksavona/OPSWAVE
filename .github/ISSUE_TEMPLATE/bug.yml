name: Bug report
description: Report reproducible behavior that differs from the documented result.
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, private operational data, or security vulnerabilities. Use the Security tab for private vulnerability reports.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: This report does not disclose a security vulnerability or sensitive data.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what is the user impact?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the problem using synthetic data.
      placeholder: |
        1. Start from ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What documented or intended result did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include revision/version, operating system, runtime, browser, database, and deployment details that are relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add minimal logs, screenshots, or output with sensitive values removed.
      render: shell
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      description: List objective checks that would demonstrate the issue is fixed.
